[versions]
gtceu = "8.0.0"
ldlib = "1.0.35.a"
mui = "3.3.0-SNAPSHOT"
registrate = "MC1.21-1.3.0+67"
configuration = "3.1.1-neoforge"

jei = "19.25.1.328"
emi = "1.1.24+1.21.1"
tmrv = "0.8.1+mc.21.1"
jade = "15.10.5+neoforge"

ae2 = "19.2.17"
guideme = "21.1.16"
ae2wtlib = "19.5.0"
clothconfig = "15.0.140"

sodium = "0.8.12-beta.1+mc1.21.1"
iris = "8242804"

[libraries]
ldlib               = { module = "com.lowdragmc.ldlib:ldlib-neoforge-1.21.1", version.ref = "ldlib" }
mui                 = { module = "brachy.modularui:modularui-mc1.21.1", version.ref = "mui" }
registrate          = { module = "com.tterrag.registrate:Registrate", version.ref = "registrate" }
configuration       = { module = "dev.toma.configuration:configuration-1.21.1", version.ref = "configuration" }

jei-common-api      = { module = "mezz.jei:jei-1.21.1-common-api", version.ref = "jei" }
jei-neoforge-api    = { module = "mezz.jei:jei-1.21.1-neoforge-api", version.ref = "jei" }
jei-neoforge-impl   = { module = "mezz.jei:jei-1.21.1-neoforge", version.ref = "jei" }
emi                 = { module = "dev.emi:emi-neoforge", version.ref = "emi" }
tmrv                = { module = "maven.modrinth:tmrv", version.ref = "tmrv" }
jade                = { module = "maven.modrinth:jade", version.ref = "jade" }

ae2                 = { module = "org.appliedenergistics:appliedenergistics2", version.ref = "ae2" }
guideme             = { module = "org.appliedenergistics:guideme", version.ref = "guideme" }
ae2wtlib            = { module = "de.mari_023:ae2wtlib", version.ref = "ae2wtlib" }
ae2wtlib-api        = { module = "de.mari_023:ae2wtlib_api", version.ref = "ae2wtlib" }
clothconfig         = { module = "me.shedaniel.cloth:cloth-config-neoforge", version.ref = "clothconfig" }

sodium              = { module = "net.caffeinemc:sodium-neoforge-mod", version.ref = "sodium" }
sodiumapi           = { module = "net.caffeinemc:sodium-neoforge-api", version.ref = "sodium" }
sodiumshell         = { module = "net.caffeinemc:sodium-neoforge", version.ref = "sodium" }
iris                = { module = "curse.maven:irisshaders-455508", version.ref = "iris" }

[bundles]
jei = ["jei-common-api", "jei-neoforge-api", "jei-neoforge-impl"]
